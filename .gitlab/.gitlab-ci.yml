# GitLab CI/CD Pipeline
# Native-syntax translation of the GitHub Actions workflows under .github/workflows/:
# ci.yml, benchmark.yml, security.yml, docs.yml. agent_sync.yml is GitHub-Projects-
# specific (see the note under the "sync" stage below) and has no GitLab job here.

stages:
  - sync
  - test
  - security
  - docs
  - benchmark
# ==========================================
# STAGE: TEST (ci.yml)
# ==========================================
lint-test-frontend:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm run lint --if-present
    - npm run build

lint-test-rust:
  stage: test
  image: rust:latest
  script:
    - rustup component add rustfmt clippy
    - cd src-tauri
    - cargo fmt -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

lint-test-android:
  stage: test
  image: eclipse-temurin:21-jdk
  script:
    - cd android
    - ./gradlew ktlintCheck test

# ==========================================
# STAGE: SECURITY (security.yml)
# ==========================================
security-cargo-audit:
  stage: security
  image: rust:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cargo install cargo-audit --locked
    - cd src-tauri
    - cargo audit

security-npm-audit:
  stage: security
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm audit --audit-level=high

security-pip-audit:
  stage: security
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install uv
    - cd git
    - uv sync
    - uv run pip-audit

# ==========================================
# STAGE: DOCS (docs.yml)
# ==========================================
# This special job name "pages" is required by GitLab to deploy to GitLab Pages.
pages:
  stage: docs
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "docs/**/*"
        - "docs/mkdocs.yml"
  script:
    - pip install mkdocs-material
    # GitLab Pages requires the output directory to be named "public"
    - mkdocs build --config-file docs/mkdocs.yml --strict --site-dir public
  artifacts:
    paths:
      - public

# ==========================================
# STAGE: BENCHMARK (benchmark.yml)
# ==========================================
benchmark:
  stage: benchmark
  image: rust:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "src-tauri/benches/**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd src-tauri
    - cargo bench

# ==========================================
# STAGE: SYNC (agent_sync.yml) -- not portable
# ==========================================
# agent_sync.yml orchestrates git/scripts/sync_backlog.py, which talks to
# the GitHub Projects (V2) GraphQL API specifically. GitLab has its own
# Issue Boards / epics feature with a different, incompatible API -- no
# drop-in translation exists, and porting the script itself is out of scope
# for a CI-config mirror. The job below still runs the config-validation
# steps locally; wire in a GitLab-native board sync separately if needed.
agent-backlog-sync:
    stage: sync
    image: python:3.12
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
          changes:
              - "docs/moon/ROADMAP.md"
              - "docs/moon/CHANGELOG.md"
        - if: '$CI_PIPELINE_SOURCE == "web"'
    before_script:
        - pip install uv
        - uv sync --project git
    script:
        - uv run --project git python -c "import json,pathlib; json.loads(pathlib.Path('git/config/project_labels.json').read_text())"
        - uv run --project git python -c "import yaml,pathlib; yaml.safe_load(pathlib.Path('git/config/automation_rules.yaml').read_text())"
        - uv run --project git python -m git.scripts.sync_backlog --repo-owner ACFHarbinger --repo-name Coding-Assistants --project-id "$PROJECT_ID"
    variables:
        GITHUB_TOKEN: $PROJECT_AUTOMATION_TOKEN
