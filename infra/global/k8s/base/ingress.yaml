apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coding-assistants-docs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: docs.coding-assistants.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coding-assistants-docs
                port:
                  number: 80
