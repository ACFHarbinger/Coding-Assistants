apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coding-assistants-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: coding-assistants-docs
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: coding-assistants-docs:latest
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
