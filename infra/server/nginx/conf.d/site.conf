# Virtual host for the app static export (out/).
#
# Default document root matches the official nginx image layout used by
# infra/global/docker/. Override with:
#   docker ... -e NGINX_ROOT=/path  (or edit root below)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers suitable for a static knowledge-base site.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Long-cache hashed Next.js assets under _next/static.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js static export: exact path, then .html, then directory index,
    # then the custom 404 page generated by the build.
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny hidden files (e.g. .git leftovers if someone mounts the wrong tree).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
