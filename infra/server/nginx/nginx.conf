# Main nginx process config for serving the app static export.
#
# Usage (from the repository root, after `npm run build`):
#   nginx -p "$PWD" -c infra/server/nginx/nginx.conf
#
# Or mount this tree into an nginx container:
#   docker run --rm -p 8080:80 \
#     -v "$PWD/out:/usr/share/nginx/html:ro" \
#     -v "$PWD/infra/server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     -v "$PWD/infra/server/nginx/conf.d:/etc/nginx/conf.d:ro" \
#     nginx:1.27-alpine

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip text assets from the Next.js static export.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
