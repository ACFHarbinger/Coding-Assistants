# Envoy proxy bootstrap for app.
#
# Default mode: reverse-proxy to an upstream HTTP origin serving the static
# export (e.g. the nginx container from infra/global/docker or infra/server/nginx).
#
# Usage:
#   docker run --rm -p 8080:8080 \
#     -v "$PWD/infra/server/proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
#     envoyproxy/envoy:v1.31-latest -c /etc/envoy/envoy.yaml
#
# Point the cluster address at wherever the origin listens (host.docker.internal
# when the origin runs on the Docker host).

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: github_pages
                codec_type: AUTO
                generate_request_id: true
                use_remote_address: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: github_pages
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: origin_static
                            timeout: 15s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: origin_static
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      # Origin that already serves the Next.js export (adjust host/port).
      load_assignment:
        cluster_name: origin_static
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8081
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
