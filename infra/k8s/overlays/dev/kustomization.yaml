apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coding-assistants-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: coding-assistants-docs
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: coding-assistants-docs:dev
