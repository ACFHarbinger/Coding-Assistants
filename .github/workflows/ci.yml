name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  lint-test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The Tauri crate links against the system GTK/WebKit stack; without
      # these, `glib-sys`'s build script fails at pkg-config and clippy/test
      # never even run (this is what made lint-test-rust red on main).
      - name: Install Linux GTK/WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl wget file
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../target"
      # `tauri.conf.json` bundle.externalBin requires the Creative Tools MCP
      # sidecar binaries to exist before any cargo invocation of `tauri-app`
      # (its build script resolves the target-qualified names). Mirror the
      # release workflow: build the seven bridges, then stage them.
      - name: Build and stage Creative Tools MCP sidecars
        run: |
          target="$(rustc -vV | awk '/^host: / { print $2 }')"
          cargo build --release --target "${target}" \
            -p mcp-blender \
            -p mcp-krita \
            -p mcp-godot \
            -p mcp-aseprite \
            -p mcp-unreal \
            -p mcp-unity \
            -p mcp-opentoonz
          node tools/release/stage-mcp-sidecars.mjs "${target}"
      - name: Format check (whole workspace)
        run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  lint-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew ktlintCheck test
        working-directory: android
