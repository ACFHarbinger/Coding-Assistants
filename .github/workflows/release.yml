name: Release

# Tag-triggered build + bundle + draft GitHub Release for Coding Assistants v1.0+.
#
# Targets: Linux (.deb, AppImage), Windows (.msi, NSIS .exe), Android (APK, AAB).
# No macOS. Windows bundles are UNSIGNED for v1.0 (SmartScreen warning accepted).
#
# Version source of truth is package.json; tauri.conf.json reads "version":
# "../package.json". Push a tag like `v1.0.0` (or run manually with dry_run) to
# build. The Release is created as a DRAFT — review artifacts, then publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not create/upload a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "deb,appimage"
          - os: windows-latest
            bundles: "msi,nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl wget file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      # Tauri's externalBin entries expect target-qualified files. Shared with
      # ci.yml `lint-test-rust` so the sidecar crate list cannot drift (#201).
      - name: Build Creative Tools MCP sidecars
        uses: ./.github/actions/stage-mcp-sidecars

      # tauri-action creates/updates a Release ONLY when `tagName` is non-empty.
      # On a real `v*` tag push that is the tag name → a draft Release. On
      # `workflow_dispatch` (dry run) `tagName` is empty → tauri-action just
      # builds and, seeing no releaseId/tagName, "skips all uploads". The
      # explicit upload-artifact step below then attaches the bundles as run
      # artifacts so a dry run is actually inspectable. On a real `v*` tag,
      # tauri-action uploads the bundles to the draft Release instead and this
      # step is skipped.
      - name: Build and bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Coding Assistants {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload desktop bundles as run artifacts (dry run only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed release build."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble signed APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Attach Android artifacts to the draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
