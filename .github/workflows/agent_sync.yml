name: Agent Backlog Sync

# Keeps a GitHub Project (V2) board in sync with docs/moon/ROADMAP.md /
# docs/moon/CHANGELOG.md by orchestrating git/scripts/sync_backlog.py. Runs on
# pushes to main that touch either source-of-truth doc, or on demand via
# workflow_dispatch for maintainers who want to force a resync without a doc
# edit.

on:
  push:
    branches: [main]
    paths:
      - "docs/moon/ROADMAP.md"
      - "docs/moon/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the proposed diff without mutating the board"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-backlog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync backlog to Project board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Install automation dependencies
        run: uv sync
        working-directory: git

      - name: Validate automation config
        run: |
          uv run --project git python -c "import json,pathlib; json.loads(pathlib.Path('git/config/project_labels.json').read_text())"
          uv run --project git python -c "import yaml,pathlib; yaml.safe_load(pathlib.Path('git/config/automation_rules.yaml').read_text())"

      - name: Run backlog sync
        env:
          GITHUB_TOKEN: ${ secrets.PROJECT_AUTOMATION_TOKEN }
          GEMINI_API_KEY: ${ secrets.GEMINI_API_KEY }
          PROJECT_ID: ${ vars.PROJECT_ID }
        run: |
          ARGS="--repo-owner ${ github.repository_owner } \
                --repo-name $(basename ${ github.repository }) \
                --project-id ${PROJECT_ID}"
          if [ "${ inputs.dry_run }" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run --project git python -m git.scripts.sync_backlog $ARGS

      - name: Summarize run
        if: always()
        run: |
          echo "### Agent Backlog Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: ${ github.event_name }" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: ${ inputs.dry_run || 'false' }" >> "$GITHUB_STEP_SUMMARY"
