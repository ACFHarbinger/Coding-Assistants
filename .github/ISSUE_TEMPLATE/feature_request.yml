name: ✨ Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Affected area
      options:
        - Frontend (src/)
        - Backend (src-tauri/)
        - Android companion app (android/)
        - Build / tooling (just, docker, CI)
        - Other / unknown
    validations:
      required: true
