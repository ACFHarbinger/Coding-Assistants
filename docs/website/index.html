<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding-Assistants — Documentation</title>
    <meta name="description" content="Documentation for the local-first Coding-Assistants multi-agent orchestration desktop application." />

    <!-- Social preview cards. No third-party requests: og:image points at
         the self-hosted favicon, the only brand asset currently under
         public/ with a stable, unhashed URL. A dedicated 1200x630 raster
         image would render better on platforms with poor SVG support —
         tracked as a W7 follow-up, not blocking. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coding-Assistants" />
    <meta property="og:title" content="Coding-Assistants — Documentation" />
    <meta property="og:description" content="Documentation for the local-first Coding-Assistants multi-agent orchestration desktop application." />
    <meta property="og:image" content="%BASE_URL%favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Coding-Assistants — Documentation" />
    <meta name="twitter:description" content="Documentation for the local-first Coding-Assistants multi-agent orchestration desktop application." />
    <meta name="twitter:image" content="%BASE_URL%favicon.svg" />
    <script>
      (() => {
        const stored = localStorage.getItem("ca-website-theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = stored === "light" || stored === "dark"
          ? stored
          : stored === "system"
            ? (systemDark ? "dark" : "light")
            : "dark";
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
