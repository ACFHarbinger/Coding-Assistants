[package]
name = "mcp-unreal"
version = "0.1.0"
edition = "2021"
description = "MCP bridge to a running Unreal Engine 5 editor (via the Coding-Assistants editor Python plugin)"
license = "AGPL-3.0-only"

[[bin]]
name = "coding-assistants-mcp-unreal"
path = "src/main.rs"

[dependencies]
mcp-core = { path = "../mcp-core" }
serde_json = "1"
