[package]
name = "hub"
version = "0.1.0"
edition = "2021"
description = "Coding-Assistants shared memory, messaging, and wake primitives"
license = "AGPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
