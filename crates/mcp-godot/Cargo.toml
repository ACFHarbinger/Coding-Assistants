[package]
name = "mcp-godot"
version = "0.1.0"
edition = "2021"
description = "MCP bridge to a running Godot editor (via the Coding-Assistants Godot editor plugin)"
license = "AGPL-3.0-only"

[[bin]]
name = "coding-assistants-mcp-godot"
