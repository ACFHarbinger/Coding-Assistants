[package]
name = "quota"
version = "0.1.0"
edition = "2021"
description = "Coding-Assistants shared provider-quota probing (S5c: used by src-tauri and the ca CLI)"
license = "AGPL-3.0-only"

[dependencies]
hub = { path = "../hub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.21"
# Same feature set src-tauri already builds (feature unification keeps one
# reqwest in the workspace); blocking only — the adapters are sync probes.
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
