[package]
name = "ca-cli"
version = "0.1.0"
edition = "2021"
description = "Coding-Assistants CLI helper (binary: ca)"
license = "AGPL-3.0-only"

[[bin]]
name = "ca"
path = "src/main.rs"

[dependencies]
ca-hub = { path = "../ca-hub" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
