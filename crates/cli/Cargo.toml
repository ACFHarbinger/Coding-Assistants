[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Coding-Assistants CLI helper (binary: ca)"
license = "AGPL-3.0-only"

[[bin]]
name = "ca"
path = "src/main.rs"

[dependencies]
hub = { path = "../hub" }
tui = { path = "../tui" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
