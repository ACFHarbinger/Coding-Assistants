[package]
name = "mcp-aseprite"
version = "0.1.0"
edition = "2021"
description = "MCP bridge to Aseprite via its batch-mode Lua scripting (aseprite -b --script)"
license = "AGPL-3.0-only"

[[bin]]
name = "coding-assistants-mcp-aseprite"
path = "src/main.rs"

[dependencies]
mcp-core = { path = "../mcp-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
